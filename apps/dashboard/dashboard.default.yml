# MADY dashboard configuration.
#
# The dashboard is a generic engine: it reads fleetd's ledger (READ-ONLY),
# renders tabs → panes, and — on a non-navigation keypress over a focused row —
# hands the action off to ONE external handler:
#
#   <action_handler> <tab/pane> <key> <row-field>...
# e.g.
#   handler.sh fleet/cogs enter worker MADY-123 "" worker-MADY-123 implementing
#
# All action logic lives in that handler (default `~/.mady/apps/dashboard/
# handler.sh`), which owns the (coordinate, key) → action mapping. The dashboard
# knows nothing about what the actions DO — it only reports which row is focused
# and which key was pressed. To change/add an action, edit the handler's `case`;
# to point at your own, change `action_handler` below. A leading `~/` is expanded.
#
# Reserved keys (cannot be intercepted — they belong to the TUI core):
#   q, Esc, r, j, k, Up, Down, Tab, S-Tab, 1, 2, y, Y, space.
#   (Tab / S-Tab switch tabs; Up/Down and 1/2 switch panes on a two-pane tab;
#    j/k move the row cursor; y/Y yank the pane/page.)
#   Every other key is forwarded to the handler with the focused coordinate;
#   an unhandled (coordinate, key) pair is the handler's no-op.
#
# Coordinates (tab/pane) and their row fields:
#   fleet/cogs         kind · ticket · convoy · tmux_session · state
#   fleet/escalations  ticket · raised_by · ship_iid
#   armada/ships       iid · ticket · pilot · url
#   board/tickets      key · status · convoy
#   board/convoys      key · title
#
# This is the embedded recovery default (baked into the dashboard binary). The
# live config the operator edits is `apps/dashboard/dashboard.yml`.

action_handler: '~/.mady/apps/dashboard/handler.sh'
