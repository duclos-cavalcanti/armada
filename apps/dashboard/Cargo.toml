[package]
name = "dashboard"
version = "0.1.0"
edition = "2021"
description = "TUI dashboard for the fleet — reads the fleet ledger read-only and displays the cog roster + escalations (Fleet), the open MRs (Armada), and the sprint board + convoys (Board) live."
license = "Proprietary"

[[bin]]
name = "dashboard"
path = "src/main.rs"

[dependencies]
# Fleet crates — the dashboard reads the ledger directly (read-only) and renders
# domain types, so there is no mirrored schema: one shape, imported.
domain = { path = "../../crates/domain" }
ledger = { path = "../../crates/ledger" }
wire = { path = "../../crates/wire" }

ratatui = "0.29"
crossterm = "0.28"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
