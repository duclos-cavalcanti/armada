<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1240 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Role 2 — Implementation: worker + the skills it uses">
  <defs>
    <marker id="arr"        viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9DA7B3"/></marker>
    <marker id="arr-blue"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58A6FF"/></marker>
    <marker id="arr-amber"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D29922"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DB6D28"/></marker>
    <marker id="arr-cyan"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39C5CF"/></marker>
    <style><![CDATA[
      .band       { fill: rgba(255,255,255,0.02); stroke: #30363D; stroke-width: 1; stroke-dasharray: 4 3; }
      .band-label { fill: #9DA7B3; font: 700 13px sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
      .band-sub   { fill: #6E7681; font: 11px sans-serif; }
      .node       { rx: 8; stroke-width: 1.5; }
      .node.term     { fill: rgba(219,109,40,0.14); stroke: #DB6D28; }
      .node.atom     { fill: rgba(63,185,80,0.10);  stroke: #3FB950; }
      .node.team     { fill: rgba(210,153,34,0.10); stroke: #D29922; stroke-dasharray: 5 3; }
      .node.orch     { fill: rgba(88,166,255,0.14); stroke: #58A6FF; }
      .node.subagent { fill: rgba(125,125,125,0.10); stroke: #9DA7B3; stroke-dasharray: 3 3; }
      .node.agent-worker { fill: rgba(88,166,255,0.18); stroke: #58A6FF; stroke-width: 2; }
      .node.converge-note { fill: rgba(57,197,207,0.12); stroke: #39C5CF; stroke-dasharray: 4 3; }
      .agent-label { fill: #E6EDF3; font: 700 14px ui-monospace, Menlo, monospace; text-anchor: middle; }
      .agent-draft { fill: #6E7681; font: 600 10px sans-serif; text-anchor: middle; letter-spacing: 0.1em; }
      .agent-sub   { fill: #9DA7B3; font: 11px sans-serif; text-anchor: middle; }
      .label  { fill: #E6EDF3; font: 600 12px ui-monospace, Menlo, monospace; text-anchor: middle; }
      .sub    { fill: #9DA7B3; font: 10px sans-serif; text-anchor: middle; }
      .note   { fill: #39C5CF; font: 10px sans-serif; text-anchor: middle; }
      .edge   { fill: none; stroke: #6E7681; stroke-width: 1.4; }
      .edge.blue   { stroke: #58A6FF; }
      .edge.amber  { stroke: #D29922; }
      .edge.orange { stroke: #DB6D28; stroke-width: 2; }
      .edge.cyan   { stroke: #39C5CF; }
      .edge.uses-wk  { stroke: #58A6FF; stroke-width: 1.2; }
      .edge.wrap     { stroke-dasharray: 5 3; }
      .edge.handoff  { stroke-dasharray: 2 4; stroke-width: 2; }
      .edge-label  { fill: #9DA7B3; font: 10px ui-monospace, Menlo, monospace; }
      .edge-label.amber { fill: #D29922; }
      .edge-label.cyan  { fill: #39C5CF; }
    ]]></style>
  </defs>

  <rect class="band" x="20" y="20" width="1200" height="560"/>
  <text class="band-label" x="40" y="50">Role 2 · Implementation</text>
  <text class="band-sub"   x="40" y="68">worker — one per ticket, spawned by converge.sh (cron); reads the dispatch packet, drives /mady-implement, concludes by un-drafting the MR</text>

  <!-- converge.sh spawn note -->
  <rect class="node converge-note" x="40" y="92" width="180" height="48"/>
  <text class="note" x="130" y="112">🎻 converge.sh</text>
  <text class="note" x="130" y="128">spawns worker</text>

  <!-- I/O terminals -->
  <ellipse cx="130" cy="200" rx="80" ry="26" class="node term"/>
  <text class="label" x="130" y="198">📦 dispatch packet</text>
  <text class="sub"   x="130" y="213">~/.mady/state/dispatch/</text>

  <ellipse cx="130" cy="540" rx="74" ry="26" class="node term"/>
  <text class="label" x="130" y="538">📤 open MR</text>
  <text class="sub"   x="130" y="553">undrafted · In Review</text>

  <path class="edge cyan handoff" d="M130,140 L130,174" marker-end="url(#arr-cyan)"/>
  <line class="edge orange" x1="130" y1="226" x2="130" y2="514" marker-end="url(#arr-orange)"/>

  <!-- Worker agent -->
  <rect class="node agent-worker" x="260" y="160" width="280" height="76"/>
  <text class="agent-label" x="400" y="188">👷  worker</text>
  <text class="agent-sub"   x="400" y="220">.claude/agents/worker.md</text>
  <text class="agent-sub"   x="400" y="234">persistent Opus · one per ticket</text>

  <!-- /mady-implement (meta) -->
  <rect class="node orch" x="600" y="100" width="220" height="56"/>
  <text class="label" x="710" y="124">/mady-implement</text>
  <text class="sub"   x="710" y="140">meta · 4-step · shape router</text>

  <!-- shape sub-skills -->
  <rect class="node atom" x="850" y="85" width="190" height="32"/>
  <text class="label" x="945" y="105">/mady-implement-logic</text>

  <rect class="node atom" x="850" y="121" width="190" height="32"/>
  <text class="label" x="945" y="141">/mady-implement-infra</text>

  <rect class="node atom" x="850" y="157" width="190" height="32"/>
  <text class="label" x="945" y="177">/mady-implement-docs</text>

  <rect class="node atom" x="850" y="193" width="190" height="32"/>
  <text class="label" x="945" y="213">/mady-implement-claude</text>

  <!-- tdd-* subagents (Task tool, under the logic path) -->
  <rect class="node subagent" x="1060" y="85" width="160" height="40"/>
  <text class="label" x="1140" y="103">tdd-red / -green</text>
  <text class="sub"   x="1140" y="118">subagents (Task tool)</text>

  <rect class="node subagent" x="1060" y="130" width="160" height="40"/>
  <text class="label" x="1140" y="148">tdd-refactor</text>
  <text class="sub"   x="1140" y="163">subagent (Task tool)</text>

  <!-- Step 2: MR create -->
  <rect class="node orch" x="600" y="270" width="200" height="44"/>
  <text class="label" x="700" y="288">/mady-mr-create</text>
  <text class="sub"   x="700" y="304">push + draft</text>

  <rect class="node team" x="830" y="270" width="200" height="44"/>
  <text class="label" x="930" y="294">/create-mr  [team]</text>

  <rect class="node atom" x="1050" y="270" width="170" height="44"/>
  <text class="label" x="1135" y="288">/mady-mr-block-on</text>
  <text class="sub"   x="1135" y="304">optional · stacked deps</text>

  <!-- Step 3: review loop -->
  <rect class="node team" x="600" y="350" width="200" height="44"/>
  <text class="label" x="700" y="368">/mr-review  [team]</text>
  <text class="sub"   x="700" y="384">looped until nits only</text>

  <rect class="node subagent" x="830" y="350" width="200" height="44"/>
  <text class="label" x="930" y="368">SME audit subagents</text>
  <text class="sub"   x="930" y="384">read-only · audit</text>

  <!-- Step 4: conclude -->
  <rect class="node orch" x="600" y="430" width="200" height="44"/>
  <text class="label" x="700" y="448">conclude</text>
  <text class="sub"   x="700" y="464">undraft MR + Jira "In Review"</text>

  <!-- worker-status schema -->
  <rect class="node atom" x="600" y="500" width="450" height="44"/>
  <text class="label" x="825" y="518">schemas/worker-status.schema.json</text>
  <text class="sub"   x="825" y="534">state ∈ {implementing, concluded, escalated}</text>

  <!-- Worker uses arrows -->
  <path class="edge uses-wk" d="M540,180 C570,128 580,128 600,128" marker-end="url(#arr-blue)"/>
  <path class="edge uses-wk" d="M540,188 C570,292 580,292 600,292" marker-end="url(#arr-blue)"/>
  <path class="edge uses-wk" d="M540,196 C570,372 580,372 600,372" marker-end="url(#arr-blue)"/>
  <path class="edge uses-wk" d="M540,204 C570,452 580,452 600,452" marker-end="url(#arr-blue)"/>
  <path class="edge uses-wk" d="M540,212 C570,522 580,522 600,522" marker-end="url(#arr-blue)"/>
  <text class="edge-label" x="556" y="168">uses</text>

  <!-- /mady-implement → shape sub-skills (Step 1) -->
  <path class="edge blue" d="M820,116 L850,101" marker-end="url(#arr-blue)"/>
  <path class="edge blue" d="M820,124 L850,137" marker-end="url(#arr-blue)"/>
  <path class="edge blue" d="M820,132 L850,173" marker-end="url(#arr-blue)"/>
  <path class="edge blue" d="M820,140 L850,209" marker-end="url(#arr-blue)"/>
  <text class="edge-label" x="826" y="84">Step 1 · shape</text>

  <!-- shape-logic → tdd-* -->
  <path class="edge" d="M1040,101 L1060,105" marker-end="url(#arr)"/>
  <path class="edge" d="M1040,101 L1060,150" marker-end="url(#arr)"/>
  <text class="edge-label" x="1040" y="78">logic path</text>

  <!-- /mady-mr-create wraps /create-mr -->
  <path class="edge amber wrap" d="M800,292 L830,292" marker-end="url(#arr-amber)"/>
  <text class="edge-label amber" x="804" y="286">wraps</text>

  <!-- /mr-review uses SME -->
  <path class="edge" d="M800,372 L830,372" marker-end="url(#arr)"/>

  <!-- mr-review self-loop -->
  <path class="edge blue" d="M600,382 C570,382 570,362 600,362" marker-end="url(#arr-blue)" stroke-dasharray="4 3"/>
  <text class="edge-label" x="540" y="380">loop</text>

  <!-- Step 2 → 3 → 4 -->
  <path class="edge blue" d="M700,314 L700,350" marker-end="url(#arr-blue)"/>
  <path class="edge blue" d="M700,394 L700,430" marker-end="url(#arr-blue)"/>

  <!-- Conclude → open MR (output handoff) -->
  <path class="edge blue handoff" d="M600,452 C480,490 300,525 204,540" marker-end="url(#arr-blue)"/>
  <text class="edge-label" x="350" y="500">un-drafts the MR · exits</text>
</svg>
