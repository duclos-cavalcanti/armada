<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .t    { fill:#E6EDF3; font-weight:700; }
      .lbl  { fill:#E6EDF3; font-weight:600; }
      .sub  { fill:#9DA7B3; font-family:ui-monospace, Menlo, monospace; }
      .mono { fill:#E6EDF3; font-family:ui-monospace, Menlo, monospace; }
      .el   { fill:#9DA7B3; font-family:ui-monospace, Menlo, monospace; }
      .dim  { fill:#6E7681; font-family:ui-monospace, Menlo, monospace; }
      .rd   { fill:#F85149; font-family:ui-monospace, Menlo, monospace; }
      .cite { fill:#6E7681; font-family:ui-monospace, Menlo, monospace; }
    </style>
    <marker id="a"  markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9DA7B3"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#58A6FF"/></marker>
    <marker id="ard" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#F85149"/></marker>
  </defs>

  <rect x="0" y="0" width="1360" height="610" fill="#0D1117"/>
  <text x="30" y="36" class="t" font-size="20">Domains API — CRUD at a glance</text>

  <!-- legend -->
  <rect x="905" y="20" width="12" height="12" rx="2" fill="#58A6FF"/><text x="922" y="30" class="el" font-size="11">R read (sync)</text>
  <rect x="1030" y="20" width="12" height="12" rx="2" fill="#3FB950"/><text x="1047" y="30" class="el" font-size="11">C create</text>
  <rect x="1130" y="20" width="12" height="12" rx="2" fill="#D29922"/><text x="1147" y="30" class="el" font-size="11">U update</text>
  <rect x="1230" y="20" width="12" height="12" rx="2" fill="#F85149"/><text x="1247" y="30" class="el" font-size="11">D deactivate</text>

  <!-- calls -->
  <rect x="30" y="90"  width="185" height="46" rx="9" fill="#161B22" stroke="#58A6FF" stroke-width="1.6"/>
  <text x="42" y="108" class="mono" font-size="12">GET /v1/domains[/{id}]</text><text x="42" y="126" class="el" font-size="10">R · read / list</text>
  <rect x="30" y="146" width="185" height="46" rx="9" fill="#161B22" stroke="#3FB950" stroke-width="1.6"/>
  <text x="42" y="164" class="mono" font-size="12">POST /v1/domains</text><text x="42" y="182" class="el" font-size="10">C · create</text>
  <rect x="30" y="202" width="185" height="46" rx="9" fill="#161B22" stroke="#D29922" stroke-width="1.6"/>
  <text x="42" y="220" class="mono" font-size="12">PUT /v1/domains/{id}</text><text x="42" y="238" class="el" font-size="10">U · update</text>
  <rect x="30" y="258" width="185" height="46" rx="9" fill="#161B22" stroke="#F85149" stroke-width="1.6"/>
  <text x="42" y="276" class="mono" font-size="12">DELETE /v1/domains/{id}</text><text x="42" y="294" class="el" font-size="10">D · deactivate</text>

  <!-- shared blocks -->
  <rect x="245" y="152" width="105" height="92" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="297" y="193" class="lbl" font-size="13" text-anchor="middle">API</text><text x="297" y="211" class="lbl" font-size="13" text-anchor="middle">Gateway</text>
  <rect x="370" y="152" width="115" height="92" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="427" y="193" class="lbl" font-size="13" text-anchor="middle">domains</text><text x="427" y="211" class="lbl" font-size="13" text-anchor="middle">lambda</text>

  <!-- calls -> GW (colored) -->
  <line x1="215" y1="113" x2="243" y2="182" stroke="#58A6FF" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="215" y1="169" x2="243" y2="190" stroke="#3FB950" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="215" y1="225" x2="243" y2="198" stroke="#D29922" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="215" y1="281" x2="243" y2="206" stroke="#F85149" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="350" y1="198" x2="368" y2="198" stroke="#9DA7B3" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- READ branch (blue, sync) -->
  <line x1="485" y1="178" x2="556" y2="140" stroke="#58A6FF" stroke-width="1.6" marker-end="url(#ab)"/>
  <rect x="560" y="110" width="180" height="54" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="650" y="132" class="lbl" font-size="13" text-anchor="middle">hierarchy read</text>
  <text x="650" y="150" class="sub" font-size="10" text-anchor="middle">get_domain · list_domains</text>
  <text x="650" y="100" class="el" font-size="10" text-anchor="middle">no gate · no vote</text>
  <line x1="740" y1="137" x2="786" y2="137" stroke="#58A6FF" stroke-width="1.6" marker-end="url(#ab)"/>
  <rect x="791" y="110" width="110" height="54" rx="10" fill="#0D1117" stroke="#58A6FF" stroke-width="1.5"/>
  <text x="846" y="142" class="lbl" font-size="13" text-anchor="middle">200 OK</text>
  <!-- read not-found outcome — 404 collapse: visibility / tenant-isolation / not-a-domain,
       no existence disclosure (get_domain :1382-1383 / list_domains) -->
  <path d="M650,164 V207 H789" fill="none" stroke="#F85149" stroke-width="1.6" marker-end="url(#ard)"/>
  <rect x="791" y="180" width="110" height="54" rx="10" fill="#0D1117" stroke="#F85149" stroke-width="1.5"/>
  <text x="846" y="205" class="lbl" font-size="14" fill="#F85149" text-anchor="middle">404</text>
  <text x="846" y="221" class="dim" font-size="9" text-anchor="middle">not found</text>
  <text x="912" y="203" class="dim" font-size="9">visibility / cross-tenant collapse</text>
  <text x="912" y="217" class="dim" font-size="9">— no existence disclosure</text>

  <!-- governed feeder: lambda -> junction, then split C/U -> propose, D -> INV-3 -->
  <path d="M427,244 V352 H200" fill="none" stroke="#6E7681" stroke-width="1.6"/>
  <text x="300" y="344" class="dim" font-size="11" text-anchor="middle">governed writes · C·U·D</text>
  <path d="M200,352 V450 H150 V466" fill="none" stroke="#9DA7B3" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M200,352 H110 V384" fill="none" stroke="#F85149" stroke-width="1.6" marker-end="url(#ard)"/>

  <!-- INV-3 preflight (D-only, red) directly above propose -->
  <rect x="40" y="386" width="140" height="58" rx="10" fill="#0D1117" stroke="#F85149" stroke-width="1.7"/>
  <text x="110" y="408" class="rd" font-size="12" text-anchor="middle">INV-3 preflight</text>
  <text x="110" y="425" class="el" font-size="9" text-anchor="middle">child / balance → 409</text>
  <text x="110" y="438" class="dim" font-size="9" text-anchor="middle">D only</text>
  <line x1="110" y1="444" x2="110" y2="466" stroke="#F85149" stroke-width="1.6" marker-end="url(#ard)"/>
  <!-- INV-3 fail outcome — 409 at the bottom of the reply column; the red arrow from INV-3
       enters from below so it clears the 404 box above it, crossing the grey C/U feeder -->
  <path d="M180,414 H846 V306" fill="none" stroke="#F85149" stroke-width="1.6" marker-end="url(#ard)"/>
  <text x="480" y="406" class="rd" font-size="10" text-anchor="middle">INV-3 fail</text>
  <rect x="791" y="250" width="110" height="54" rx="10" fill="#0D1117" stroke="#F85149" stroke-width="1.5"/>
  <text x="846" y="275" class="lbl" font-size="14" fill="#F85149" text-anchor="middle">409</text>
  <text x="846" y="291" class="dim" font-size="9" text-anchor="middle">reject</text>

  <!-- governance spine -->
  <rect x="40" y="470" width="140" height="66" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="110" y="496" class="lbl" font-size="12" text-anchor="middle">propose</text>
  <text x="110" y="513" class="sub" font-size="9" text-anchor="middle">mint approvalId</text>
  <text x="110" y="527" class="sub" font-size="9" text-anchor="middle">+ StartExecution</text>

  <rect x="215" y="470" width="135" height="66" rx="10" fill="#0D1117" stroke="#39C5CF" stroke-width="1.7"/>
  <text x="282" y="496" class="lbl" font-size="12" text-anchor="middle">policy gate</text>
  <text x="282" y="513" class="el" font-size="9" text-anchor="middle">casbin (maker)</text>
  <text x="282" y="556" class="dim" font-size="9" text-anchor="middle">▼ zoom next</text>

  <rect x="390" y="470" width="145" height="66" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="462" y="496" class="lbl" font-size="12" text-anchor="middle">Pending approval</text>
  <text x="462" y="513" class="sub" font-size="9" text-anchor="middle">node Pending ·</text>
  <text x="462" y="527" class="sub" font-size="9" text-anchor="middle">approvalId surfaced</text>

  <rect x="575" y="470" width="145" height="66" rx="10" fill="#0D1117" stroke="#BC8CFF" stroke-width="1.7"/>
  <text x="647" y="496" class="lbl" font-size="12" text-anchor="middle">DA / CA quorum</text>
  <text x="647" y="513" class="el" font-size="9" text-anchor="middle">POST /v1/approvals</text>
  <text x="647" y="556" class="dim" font-size="9" text-anchor="middle">▼ zoom next</text>

  <rect x="760" y="470" width="150" height="66" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="835" y="496" class="lbl" font-size="12" text-anchor="middle">Custody relay</text>
  <text x="835" y="513" class="sub" font-size="9" text-anchor="middle">record_approval_relay</text>
  <text x="835" y="527" class="sub" font-size="9" text-anchor="middle">→ Custody executes</text>

  <rect x="945" y="454" width="165" height="104" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="1027" y="476" class="lbl" font-size="12" text-anchor="middle">terminal</text>
  <text x="957" y="500" class="sub" font-size="10" fill="#3FB950">C → activate (Active)</text>
  <text x="957" y="521" class="sub" font-size="10" fill="#D29922">U → apply update</text>
  <text x="957" y="542" class="sub" font-size="10" fill="#F85149">D → deactivate</text>

  <!-- spine arrows -->
  <line x1="180" y1="503" x2="213" y2="503" stroke="#9DA7B3" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="350" y1="503" x2="388" y2="503" stroke="#9DA7B3" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="535" y1="503" x2="573" y2="503" stroke="#9DA7B3" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="720" y1="503" x2="758" y2="503" stroke="#9DA7B3" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="910" y1="503" x2="943" y2="503" stroke="#9DA7B3" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="30" y="580" class="dim" font-size="10">D runs the lock SFN branch (v0_LockDomain / domain_lock_workflow), distinct from create's domain_lifecycle_workflow.</text>
  <text x="30" y="598" class="cite" font-size="10">grounded @ origin/master · domains/src/main.rs:2744 · propose_first.rs:60 · audit/mod.rs:2094 (INV-3) · step_functions/stack.py:182/:197/:411/:423 · record_approval_relay.rs</text>
</svg>
