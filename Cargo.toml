# fleet — the MADY factory daemon workspace (see PLAN.md).
# Virtual workspace: the fleet crates under crates/*, plus the standalone TUIs
# under apps/* — one `cargo build` builds the whole system.
[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]
# The product overlay and vendored sources are not ours to build.
exclude = ["third-party", "worktrees", "b2b-api"]

# Workspace-wide release profile (member [profile.*] tables are ignored, so it
# lives here): lean, optimized binaries for the fleet + the TUIs.
[profile.release]
opt-level = 3
lto = "thin"
strip = true
