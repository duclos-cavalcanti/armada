[package]
name = "domain"
version = "0.1.0"
edition = "2021"
description = "fleet domain — pure entities + enums (the ledger's shape). No sqlite/tmux/http."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
time = { version = "0.3", features = ["parsing"] }
