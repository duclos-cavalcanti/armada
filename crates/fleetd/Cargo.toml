[package]
name = "fleetd"
version = "0.1.0"
edition = "2021"
description = "fleet daemon — opens the ledger, probes liveness, serves context (PLAN §2.1)."

[dependencies]
domain = { path = "../domain" }
ledger = { path = "../ledger" }
wire = { path = "../wire" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
time = { version = "0.3", features = ["formatting", "std"] }
uuid = { version = "1", features = ["v4"] }
